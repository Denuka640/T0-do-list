<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Text File Synced To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <base target="_blank">
</head>
<body>
  <div class="app-container">
    <!-- App Header -->
    <header class="app-header">
      <div class="header-main">
        <div class="header-title">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
          </div>
          <div>
            <h1>TaskFlow</h1>
            <p class="subtitle" id="current-date">Synced to text file storage</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="theme-toggle" class="icon-btn" title="Toggle Dark/Light Theme" aria-label="Toggle dark/light theme">
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>

      <!-- File Storage Toolbar -->
      <div class="file-toolbar">
        <span class="file-badge">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
          Text File Storage
        </span>
        <div class="file-actions">
          <button type="button" id="save-file-btn" class="btn btn-secondary btn-sm" title="Save tasks to a .txt file">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save .txt
          </button>
          <button type="button" id="open-file-btn" class="btn btn-secondary btn-sm" title="Load tasks from a .txt file">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Open .txt
          </button>
          <input type="file" id="file-input" accept=".txt,.json" style="display: none;">
        </div>
      </div>

      <!-- Completion Progress Bar -->
      <div class="progress-card">
        <div class="progress-info">
          <span id="progress-text">0 of 0 tasks completed</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- Task Input Form -->
    <section class="card input-card">
      <form id="todo-form">
        <div class="input-row">
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <input type="text" id="new-item" placeholder="Add a new task..." autocomplete="off" required>
          </div>
          <div class="priority-wrapper">
            <label for="priority" class="sr-only">Priority</label>
            <select id="priority" title="Select Priority (1 to 5)">
              <option value="1">P1 (Lowest)</option>
              <option value="2">P2 (Low)</option>
              <option value="3" selected>P3 (Medium)</option>
              <option value="4">P4 (High)</option>
              <option value="5">P5 (Critical)</option>
            </select>
          </div>
          <button type="submit" id="add-btn" class="btn btn-primary">
            <span>Add Task</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Controls & Filters Toolbar -->
    <section class="controls-toolbar">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search tasks...">
        <button id="clear-search" class="clear-icon-btn hidden" title="Clear search">&times;</button>
      </div>

      <div class="filter-tabs" role="tablist">
        <button role="tab" aria-selected="true" data-filter="all" class="filter-tab active">All</button>
        <button role="tab" aria-selected="false" data-filter="active" class="filter-tab">Pending</button>
        <button role="tab" aria-selected="false" data-filter="completed" class="filter-tab">Done</button>
      </div>

      <div class="action-buttons">
        <button type="button" id="sort-btn" class="btn btn-ghost" title="Sort tasks by priority">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg> Sort
        </button>
        <button type="button" id="clear-completed-btn" class="btn btn-ghost danger" title="Clear completed tasks">
          Clear Done
        </button>
      </div>
    </section>

    <!-- Task List -->
    <ul id="items" class="task-list"></ul>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
